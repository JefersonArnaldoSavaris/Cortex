services:
  cortex:
    build: .
    env_file:
      - .env
    volumes:
      - cortex_data:/home/appuser/.cortex
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  cortex-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - cortex_data:/home/appuser/.cortex
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  cortex_data:
  ollama_data:
